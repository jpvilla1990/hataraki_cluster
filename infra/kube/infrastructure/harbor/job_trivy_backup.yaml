apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-trivy-backup
  namespace: harbor
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: backup-sa
      restartPolicy: OnFailure
      initContainers:
      - name: scale-down
        image: alpine/k8s:1.28.3
        command: ["/bin/sh", "/scripts/scale-down.sh"]
        volumeMounts:
        - name: backup-script
          mountPath: /scripts
      containers:
      - name: backup
        image: rclone/rclone:latest
        command: ["/bin/sh", "/scripts/backup.sh"]
        volumeMounts:
        - name: harbor-2
          mountPath: /data/harbor-trivy
          readOnly: true
        - name: backup-script
          mountPath: /scripts
        - name: backup
          mountPath: /backup

      # Post-backup: scale up applications
      - name: scale-up
        image: alpine/k8s:1.28.3
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Wait for backup container to complete
          while [ ! -f /backup/.backup-complete ]; do
            sleep 5
          done
          /scripts/scale-up.sh
        volumeMounts:
        - name: backup-script
          mountPath: /scripts
        - name: backup
          mountPath: /backup

      volumes:
      - name: harbor-2
        persistentVolumeClaim:
          claimName: data-harbor-trivy-0
      - name: backup
        emptyDir: {}
      - name: backup-script
        configMap:
          name: backup-script
          defaultMode: 0755