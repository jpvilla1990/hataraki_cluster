apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: backup
data:
  scale-down.sh: |
    #!/bin/sh
    set -e
    
    echo "Scaling down Keycloak deployment..."
    kubectl scale deployment keycloak -n keycloak --replicas=0
    kubectl wait --for=delete pod -l app=keycloak -n keycloak --timeout=300s || true
    
    echo "Scaling down Vault statefulset..."
    kubectl scale statefulset vault -n vault --replicas=0
    kubectl wait --for=delete pod -l app=vault -n vault --timeout=300s || true
    
    echo "All applications scaled down successfully"
    
  backup.sh: |
    #!/bin/sh
    set -e
    
    BACKUP_DATE=$(date +%Y%m%d-%H%M%S)
    BACKUP_DIR="/backup"
    
    echo "Starting backup at ${BACKUP_DATE}"
    
    # Install required tools
    apk add --no-cache zip
    
    # Backup Keycloak
    echo "Backing up Keycloak data..."
    cd /data/keycloak
    zip -r "${BACKUP_DIR}/keycloak-${BACKUP_DATE}.zip" .
    
    # Backup Vault
    echo "Backing up Vault data..."
    cd /data/vault
    zip -r "${BACKUP_DIR}/vault-${BACKUP_DATE}.zip" .
    
    # Create checksums
    cd "${BACKUP_DIR}"
    sha256sum *.zip > "checksums-${BACKUP_DATE}.txt"
    
    echo "Backup completed successfully!"
    echo "Backup files:"
    ls -lh "${BACKUP_DIR}"
    
  scale-up.sh: |
    #!/bin/sh
    set -e
    
    echo "Scaling up Keycloak deployment..."
    kubectl scale deployment keycloak -n keycloak --replicas=1
    
    echo "Scaling up Vault statefulset..."
    kubectl scale statefulset vault -n vault --replicas=1
    
    echo "All applications scaled up successfully"