apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - certificate.yaml

patches:
  - target:
      kind: Gateway
      name: traefik-gateway
    patch: |-
      - op: replace
        path: /spec/listeners/0/allowedRoutes/namespaces/from
        value: All
      - op: add
        path: /spec/listeners/-
        value:
          name: websecure
          port: 8443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: tls-secret
                namespace: traefik
          allowedRoutes:
            namespaces:
              from: All