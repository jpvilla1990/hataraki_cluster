apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-secret
  namespace: traefik
spec:
  secretName: tls-secret
  dnsNames:
    - test.hatarakiassistant.com
    - vault.hatarakiassistant.com
    - keycloak.hatarakiassistant.com
    - harbor.hatarakiassistant.com
    - tunnel.hatarakiassistant.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer