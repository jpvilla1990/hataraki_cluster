apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: '38.0.2'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
  values:
    providers:
      kubernetesGateway:
        enabled: true
        experimentalChannel: true
    service:
      type: LoadBalancer
    ports:
      ssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        protocol: TCP
      ssh-reverse-tunnel:
        port: 2223
        expose:
          default: true
        exposedPort: 2223
        protocol: TCP
    gateway:
      enabled: false