apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: keycloak
      version: '25.2.0'
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: keycloak
  install:
    createNamespace: true
  values:
    image:
      registry: quay.io
      repository: keycloak/keycloak
      tag: 26.3.3
    auth:
      adminUser: admin
      adminPassword: changeme  # Change this!
    service:
      type: ClusterIP
      ports:
        http: 8080
    ingress:
      enabled: false
    postgresql:
      enabled: true
      auth:
        username: keycloak
        password: keycloak-db-pass
        database: keycloak