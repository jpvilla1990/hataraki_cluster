apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-backup
  namespace: harbor
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: backup-sa
      restartPolicy: OnFailure
      initContainers:
      - name: scale-down
        image: alpine/k8s:1.28.3
        command: ["/bin/sh", "/scripts/scale-down.sh"]
        volumeMounts:
        - name: backup-script
          mountPath: /scripts
      containers:
      - name: backup
        image: rclone/rclone:latest
        command: ["/bin/sh", "/scripts/backup.sh"]
        volumeMounts:
       # - name: keycloak-data
       #   mountPath: /data/keycloak
       #   readOnly: true
       # - name: vault-data
       #   mountPath: /data/vault
       #   readOnly: true
        - name: harbor-1
          mountPath: /data/harbor-redis
          readOnly: true
        - name: harbor-2
          mountPath: /data/harbor-trivy
          readOnly: true
        - name: harbor-3
          mountPath: /data/harbor-database
          readOnly: true
        - name: harbor-4
          mountPath: /data/harbor-jobservice
          readOnly: true
        - name: harbor-5
          mountPath: /data/harbor-registry
          readOnly: true
        - name: backup-script
          mountPath: /scripts
        - name: backup
          mountPath: /backup

      # Post-backup: scale up applications
      - name: scale-up
        image: alpine/k8s:1.28.3
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Wait for backup container to complete
          while [ ! -f /backup/.backup-complete ]; do
            sleep 5
          done
          /scripts/scale-up.sh
        volumeMounts:
        - name: backup-script
          mountPath: /scripts
        - name: backup
          mountPath: /backup

      volumes:
      #- name: keycloak-data
      #  persistentVolumeClaim:
      #    claimName: keycloak
      #- name: vault-data
      #  persistentVolumeClaim:
      #    claimName: data-vault-0
      - name: harbor-1
        persistentVolumeClaim:
          claimName: data-harbor-redis-0
      - name: harbor-2
        persistentVolumeClaim:
          claimName: data-harbor-trivy-0
      - name: harbor-3
        persistentVolumeClaim:
          claimName: database-data-harbor-database-0
      - name: harbor-4
        persistentVolumeClaim:
          claimName: harbor-jobservice
      - name: harbor-5
        persistentVolumeClaim:
          claimName: harbor-registry
      - name: backup
        emptyDir: {}
      - name: backup-script
        configMap:
          name: backup-script
          defaultMode: 0755