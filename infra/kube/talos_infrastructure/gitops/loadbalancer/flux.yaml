apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-infra
  namespace: flux-system
spec:
  interval: 5m
  path: ./infra/kube/talos_infrastructure/gitops/loadbalancer/infrastructure
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-ippool
  namespace: flux-system
spec:
  interval: 5m
  path: ./infra/kube/talos_infrastructure/gitops/loadbalancer/application
  prune: true
  wait: true

  dependsOn:
    - name: cilium-infra

  sourceRef:
    kind: GitRepository
    name: cluster-config