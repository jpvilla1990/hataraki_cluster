apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 5m

  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system

  install:
    createNamespace: true

  values:
    speaker:
      frr:
        enabled: false

    frrk8s:
      enabled: false
