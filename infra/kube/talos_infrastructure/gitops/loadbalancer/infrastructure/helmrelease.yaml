apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 5m

  chart:
    spec:
      chart: cilium
      version: "1.18.6"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: cilium
      interval: 1h

  install:
    createNamespace: true

  upgrade:
    crds: CreateReplace

  values:
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 192.168.0.0/16

    ipv4NativeRoutingCIDR: 10.0.0.0/8

    loadBalancer:
      acceleration: native
      mode: dsr