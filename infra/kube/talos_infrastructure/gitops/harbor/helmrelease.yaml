apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 5m
  chart:
    spec:
      chart: harbor
      version: '1.18'
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
      interval: 1m
  install:
    createNamespace: true
  values:
    expose:
      tls:
        enabled: false
      type: route
      route:
        hosts:
        - harbor.hatarakiassistant.com
        parentRefs:
        - name: traefik-gateway
          namespace: traefik
    externalURL: https://harbor.hatarakiassistant.com
    existingSecretAdminPassword: harbor
    existingSecretAdminPasswordKey: admin_password
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: "longhorn-retain"
        jobservice:
          jobLog:
            storageClass: "longhorn-retain"
        database:
          storageClass: "longhorn-retain"
        trivy:
          storageClass: "longhorn-retain"
        redis:
          storageClass: "longhorn-retain"