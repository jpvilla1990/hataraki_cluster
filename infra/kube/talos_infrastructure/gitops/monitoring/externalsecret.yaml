apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
  - secretKey: admin-user
    remoteRef:
      key: monitoring
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: monitoring
      property: admin-password