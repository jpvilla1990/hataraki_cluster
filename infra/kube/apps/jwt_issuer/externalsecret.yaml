apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-issuer
  namespace: jwt-issuer
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: jwt-issuer
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.key
      remoteRef:
        key: jwt-issuer
        property: root-cert
    - secretKey: token
      remoteRef:
        key: jwt-issuer
        property: token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-pull-secret
  namespace: jwt-issuer
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: docker-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.hatarakiassistant.com": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: token
      remoteRef:
        key: harbor
        property: token
    - secretKey: username
      remoteRef:
        key: harbor
        property: username