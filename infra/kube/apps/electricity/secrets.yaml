# ── Backend: Google OAuth client id (from Vault) ───────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: electricity-data-backend-secrets
  namespace: electricity-data
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: electricity-data-backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google
        property: client_id
---
# ── Registry pull secret (dockerconfigjson from Vault) ─────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-creds
  namespace: electricity-data
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.hatarakiassistant.com": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: token
      remoteRef:
        key: harbor
        property: token
    - secretKey: username
      remoteRef:
        key: harbor
        property: username