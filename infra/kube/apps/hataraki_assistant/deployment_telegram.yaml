# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hataraki-assistant-telegram
  namespace: hataraki-assistant
  labels:
    app: hataraki-assistant-telegram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hataraki-assistant-telegram
  template:
    metadata:
      labels:
        app: hataraki-assistant-telegram
    spec:
      imagePullSecrets:
        - name: docker-pull-secret
      containers:
        - name: telegram-bot
          image: harbor.hatarakiassistant.com/docker/telegram_bot:0.12.0
          env:
            - name: ISSUER_URL
              value: http://jwt-issuer.jwt-issuer:8000
            - name: LLM_API_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: hataraki-assistant-config
                  key: LLM_API_ENDPOINT
            - name: MAIN_AGENT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: hataraki-assistant-config
                  key: MAIN_AGENT_MODEL
            - name: MCP_API_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: hataraki-assistant-config
                  key: MCP_API_ENDPOINT
            - name: JWT_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: hataraki-assistant-config
                  key: JWT_ISSUER_URL
            - name: JWT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hataraki-assistant-config
                  key: JWT_ENABLED
            # Individual keys from Secret
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-secrets
                  key: bot_token
            - name: LLM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: regolo-tokens
                  key: token
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-issuer
                  key: token
          volumeMounts:
            - name: output
              mountPath: /app/telegram_bot/output
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: output
          emptyDir: {}
