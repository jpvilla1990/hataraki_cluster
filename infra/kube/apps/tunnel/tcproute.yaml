apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh-route
  namespace: tunnel
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: ssh
  rules:
    - backendRefs:
        - name: tunnel-service
          port: 2222
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh-reverse-tunnel-routel
  namespace: tunnel
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: ssh-reverse-tunnel
  rules:
    - backendRefs:
        - name: tunnel-service
          port: 2223