# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: tunnel
  labels:
    app: tunnel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-service
  template:
    metadata:
      labels:
        app: tunnel-service
    spec:
      containers:
        - name: tunnel
          image: linuxserver/openssh-server:latest
          command:
            - /bin/bash
            - -c
            - |
              mkdir -p /config/.ssh && chmod 700 /config/.ssh &&
              mkdir -p /config/sshd &&
              cp /tmp/sshd_config /config/sshd/sshd_config &&
              echo "${AUTH_PUBLIC_KEYS}" >> /config/.ssh/authorized_keys &&
              exec /init
          ports:
            - containerPort: 2222
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PASSWORD_ACCESS
              value: "true"
            - name: USER_NAME
              value: "admin"
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tunnel
                  key: password
            - name: AUTH_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: tunnel
                  key: auth_public_keys
          volumeMounts:
            - name: sshd-config
              mountPath: /tmp/sshd_config
              subPath: sshd_config
      volumes:
        - name: sshd-config
          configMap:
            name: sshd-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-node-exporter
  namespace: tunnel
  labels:
    app: tunnel-node-exporter-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-node-exporter-service
  template:
    metadata:
      labels:
        app: tunnel-node-exporter-service
    spec:
      containers:
        - name: tunnel-node-exporter
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openssh-client
              mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
              echo "${PRIVATE_KEY}" >> /root/.ssh/id_ed25519 &&
              chmod 600 /root/.ssh/id_ed25519 &&
              ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
                -L 9100:0.0.0.0:9100 \
                ${SERVER_USER}@tunnel-service -p 2223 -N
          ports:
            - containerPort: 9100
          env:
            - name: SERVER_USER
              valueFrom:
                secretKeyRef:
                  name: tunnel
                  key: server_user
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: tunnel
                  key: private_key