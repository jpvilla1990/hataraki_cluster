apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: caregiver
  namespace: caregiver
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: caregiver
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: json
      remoteRef:
        key: google
        property: json
    - secretKey: client_id
      remoteRef:
        key: google
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: google
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-pull-secret
  namespace: caregiver
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: docker-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.hatarakiassistant.com": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: token
      remoteRef:
        key: harbor
        property: token
    - secretKey: username
      remoteRef:
        key: harbor
        property: username