apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caregiver
  namespace: caregiver
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - caregiver.hatarakiassistant.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: caregiver
          port: 8000