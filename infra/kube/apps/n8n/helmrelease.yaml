apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 5m
  chart:
    spec:
      chart: n8n
      version: '2.1.1'
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: n8n
      interval: 1m
  values:
    fullnameOverride: n8n
    main:
      extraEnv:
        N8N_HOST:
          value: "n8n.hatarakiassistant.com"
        N8N_PROTOCOL:
          value: "https"
        N8N_EDITOR_BASE_URL:
          value: "https://n8n.hatarakiassistant.com"
        WEBHOOK_URL:
          value: "https://n8n.hatarakiassistant.com/"
        N8N_PROXY_HOPS:
          value: "2"          # Traefik + oauth2-proxy
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_ENCRYPTION_KEY
        N8N_DIAGNOSTICS_ENABLED:
          value: "false"
        N8N_PERSONALIZATION_ENABLED:
          value: "false"
        GENERIC_TIMEZONE:
          value: "Europe/Berlin"
      persistence:
        enabled: true
        type: dynamic
        storageClass: longhorn-retain
        size: 5Gi
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi