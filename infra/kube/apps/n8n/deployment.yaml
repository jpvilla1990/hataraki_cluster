apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-oauth2-proxy
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-oauth2-proxy
  template:
    metadata:
      labels:
        app: n8n-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1   # pin a current version
          args:
            - --provider=google
            - --http-address=0.0.0.0:4180
            - --upstream=http://n8n.n8n.svc.cluster.local:80   # check the n8n Service port
            - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
            - --redirect-url=https://n8n.hatarakiassistant.com/oauth2/callback
            - --cookie-domain=n8n.hatarakiassistant.com
            - --cookie-secure=true
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --pass-host-header=true
          envFrom:
            - secretRef:
                name: n8n-oauth2-proxy
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: emails
              mountPath: /etc/oauth2-proxy
      volumes:
        - name: emails
          configMap:
            name: n8n-oauth2-proxy-emails