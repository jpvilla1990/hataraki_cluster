apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: n8n-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n
        property: encryption_key
---
# oauth2-proxy: Google client + cookie secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-oauth2-proxy
  namespace: n8n
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: n8n-oauth2-proxy
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: google
        property: client_id
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: google
        property: client_secret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET   # openssl rand -base64 32 | tr -- '+/' '-_'
      remoteRef:
        key: n8n
        property: cookie_secret