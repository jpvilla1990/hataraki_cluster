apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-webhooks
  namespace: n8n
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "n8n.hatarakiassistant.com"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /webhook/ }
        - path: { type: PathPrefix, value: /webhook-test/ }
        - path: { type: PathPrefix, value: /webhook-waiting/ }
        # - path: { type: PathPrefix, value: /form/ }          # if you use Form Trigger publicly
        # - path: { type: PathPrefix, value: /form-waiting/ }
      backendRefs:
        - name: n8n
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-ui
  namespace: n8n
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "n8n.hatarakiassistant.com"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: n8n-oauth2-proxy
          port: 4180