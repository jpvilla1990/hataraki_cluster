- name: Check if control plane is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Decide first-control-plane role
  set_fact:
    cp_action: "{{ 'skip' if admin_conf.stat.exists else 'join' }}"

- debug:
    msg: "Control-plane action: {{ cp_action }}"

- name: Stop kubelet before kubeadm operations
  systemd:
    name: kubelet
    state: stopped
  when: cp_action == "join"

- name: Join control plane
  command: "{{ hostvars[groups['first-control-plane'][0]].kubeadm_control_plane_join_command }}"
  when: cp_action == "join"

- name: Start kubelet after cleanup
  systemd:
    name: kubelet
    state: started
    enabled: yes
  when: cp_action == "join"

- name: Ensure .kube directory exists
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0700'

- name: Install kubeconfig on target host
  copy:
    content: "{{ hostvars[groups['first-control-plane'][0]].kubeconfig_content }}"
    dest: "{{ ansible_env.HOME }}/.kube/config"
    mode: '0600'
