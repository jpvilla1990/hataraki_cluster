- name: Get latest Cilium CLI version
  uri:
    url: "{{ cilium_url }}"
    return_content: yes
  register: cilium_version

- name: Set facts for Cilium installation
  set_fact:
    cilium_cli_version: "{{ cilium_version.content | trim }}"
    cli_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download and verify Cilium CLI
  block:
    - name: Download Cilium CLI binary and checksum
      get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cli_arch }}.tar.gz"
          dest: "/tmp/cilium-linux-{{ cli_arch }}.tar.gz"
        - url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cli_arch }}.tar.gz.sha256sum"
          dest: "/tmp/cilium-linux-{{ cli_arch }}.tar.gz.sha256sum"
    
    - name: Verify checksum
      shell: |
        cd /tmp && sha256sum --check cilium-linux-{{ cli_arch }}.tar.gz.sha256sum
      changed_when: false
    
    - name: Extract Cilium CLI
      unarchive:
        src: "/tmp/cilium-linux-{{ cli_arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: yes
        mode: '0755'

  always:
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/cilium-linux-{{ cli_arch }}.tar.gz"
        - "/tmp/cilium-linux-{{ cli_arch }}.tar.gz.sha256sum"

- name: Check if Cilium is already installed
  command: cilium status --wait=false
  register: cilium_status
  failed_when: false
  changed_when: false

- name: Install Cilium CNI and External Load Balancer
  command: >
    cilium install
    --version {{ version }}
    --set ipam.operator.clusterPoolIPv4PodCIDRList="{192.168.0.0/16}"
    --set ipv4NativeRoutingCIDR={{ ipv4_private_network }}
    --set loadBalancer.acceleration=native
    --set loadBalancer.mode=dsr
  when: cilium_status.rc != 0